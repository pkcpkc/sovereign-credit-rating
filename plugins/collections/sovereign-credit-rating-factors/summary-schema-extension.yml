$meta:
  type: Schema
  title: "Deduplicated Sovereign Credit Rating Risk Summary Extension Schema"
  description: "Defines extraction fields for sovereign credit rating factors per country using a deduplicated structured array format."

sovereign-credit-rating-factors:
  - name: string # Required | e.g., "Germany", "Austria", "United States"

    political_and_geopolitical_risk:
      threats: # Optional | External security risks, war exposure, sanctions, regional instability, domestic unrest, political fragmentation, government instability, or regime risk.
      strengths: # Optional | Geopolitical stability, peaceful regional relations, low conflict risk, stable government, durable political consensus, or low domestic unrest.

    institutional_and_governance_strength:
      threats: # Optional | Weak institutions, poor rule of law, corruption, weak checks and balances, limited transparency, weak accountability, judicial weakness, poor governance, or low administrative capacity.
      strengths: # Optional | Strong institutions, credible governance, rule of law, transparency, low corruption, independent courts, effective oversight, strong checks and balances, and high administrative capacity.

    policy_predictability_and_reform_continuity:
      threats: # Optional | Abrupt policy reversals, weak coalition discipline, unclear policy direction, populist pressure, inconsistent reform implementation, or unstable policymaking.
      strengths: # Optional | Stable policy formation, predictable government behavior, transparent decision-making, durable reform agendas, and strong policy continuity.

    debt_payment_culture:
      threats: # Optional | Weak willingness to pay, default history, arrears, coercive restructuring behavior, creditor-unfriendly treatment, or political resistance to debt service.
      strengths: # Optional | Strong record of timely debt repayment, creditor-friendly behavior, established commitment to honoring obligations, and low willingness-to-pay risk.

    economic_strength_and_tax_base:
      threats: # Optional | Weak GDP per capita, low income levels, narrow or informal tax base, weak productivity, limited formal economic activity, or constrained revenue-generating capacity.
      strengths: # Optional | High GDP per capita, broad taxable income base, productive economy, high formalization, strong revenue capacity, and resilient household or corporate income base.

    growth_prospects:
      threats: # Optional | Weak medium- or long-term growth, low investment, poor productivity, adverse demographics, weak competitiveness, reform stagnation, or declining output potential.
      strengths: # Optional | Resilient growth, favorable demographics, productivity gains, strong investment, competitiveness, innovation, and structural reform benefits.

    economic_diversity:
      threats: # Optional | Commodity dependence, tourism dependence, narrow economic structure, sector concentration, climate-sensitive output, or vulnerability to sector-specific shocks.
      strengths: # Optional | Diversified output, multiple export sectors, resilient domestic demand, low commodity dependence, and broad economic structure.

    external_position_and_liquidity:
      threats: # Optional | Weak FX reserves, limited external funding access, balance-of-payments pressure, high short-term external debt, weak reserve adequacy, external refinancing pressure, net external liabilities, or dependence on foreign creditors.
      strengths: # Optional | Strong FX reserves, ample external liquidity, durable market access, low short-term external debt, resilient balance of payments, net external assets, favorable international investment position, low external debt, or creditor-nation status.

    currency_and_exchange_rate_flexibility:
      threats: # Optional | Weak international currency use, dollarization, currency substitution, limited monetary flexibility, exchange-rate instability, unsustainable pegs, FX intervention pressure, devaluation risk, currency mismatches, or loss of external competitiveness.
      strengths: # Optional | Reserve-currency status, high international currency use, deep local-currency markets, credible currency framework, monetary flexibility, stable exchange-rate regime, and low FX mismatch risk.

    financial_sector_health:
      threats: # Optional | Banking-sector weakness, asset-quality deterioration, credit bubbles, liquidity stress, weak supervision, financial instability, or potential banking-sector support costs.
      strengths: # Optional | Well-capitalized banks, strong supervision, low nonperforming loans, stable funding, resilient credit markets, and low systemic financial risk.

    fiscal_performance_and_flexibility:
      threats: # Optional | Weak fiscal balance, poor revenue performance, weak expenditure control, limited fiscal flexibility, poor budget credibility, or constrained ability to adjust taxes and spending.
      strengths: # Optional | Prudent fiscal management, budget surpluses, expenditure flexibility, reliable revenue, credible budgeting, and strong capacity for fiscal adjustment.

    debt_burden:
      threats: # Optional | High government debt, rising debt ratios, heavy interest burden, refinancing pressure, unfavorable debt structure, short maturities, FX debt exposure, or weak debt affordability.
      strengths: # Optional | Low government debt, declining debt ratios, affordable interest costs, long maturities, local-currency debt, diversified investor base, and favorable debt structure.

    fiscal_sustainability:
      threats: # Optional | Persistent deficits, aging costs, pension liabilities, healthcare spending pressure, weak revenue base, structural expenditure pressure, or limited long-term adjustment capacity.
      strengths: # Optional | Sustainable debt dynamics, strong fiscal rules, long-term budget discipline, manageable aging costs, durable primary balances, and credible medium-term fiscal framework.

    contingent_liabilities:
      threats: # Optional | Off-budget obligations, state-owned enterprise liabilities, public guarantees, public-private partnership risks, local government debt, bank recapitalization risk, or other implicit liabilities.
      strengths: # Optional | Low off-budget risks, transparent guarantees, limited SOE liabilities, strong public-sector governance, contained financial-sector backstop risk, and clear fiscal risk reporting.

    monetary_policy_and_price_stability:
      threats: # Optional | High or volatile inflation, deflation, loss of price anchor, unanchored inflation expectations, monetary financing, weak monetary transmission, political interference with the central bank, fiscal dominance, or weakened monetary-policy credibility.
      strengths: # Optional | Low and stable inflation, credible inflation targeting, anchored expectations, effective monetary transmission, independent central bank, strong monetary-policy governance, and strong anti-inflation record.
